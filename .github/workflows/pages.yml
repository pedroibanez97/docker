# Publica la presentación en GitHub Pages cada vez que hay cambios en main.
# Se publican la versión práctica (raíz) y la versión completa (/version-completa/).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: leer el código y publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verificar la versión práctica
        run: node scripts/verificar.mjs

      - name: Verificar la versión completa
        run: node version-completa/scripts/verificar.mjs

      - name: Preparar el sitio
        run: |
          mkdir -p _site/version-completa
          cp -r index.html assets guia _site/
          cp -r version-completa/index.html version-completa/assets version-completa/guia _site/version-completa/

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5
